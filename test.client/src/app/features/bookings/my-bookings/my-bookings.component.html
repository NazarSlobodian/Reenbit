<h2>My Bookings</h2>

<table *ngIf="(bookings$ | async) as bookings; else loading">
  <tr *ngIf="bookings.length === 0">
    <td>You have no bookings yet.</td>
  </tr>
  <tr *ngFor="let booking of bookings">
    <td>{{ booking.roomName }}</td>
    <td>{{ booking.startTime | date:'short' }} – {{ booking.endTime | date:'shortTime' }}</td>
  </tr>
</table>

<ng-template #loading>
  <p>Loading…</p>
</ng-template>
